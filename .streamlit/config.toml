[theme]
base = "dark"
primaryColor = "#4c8dff"
backgroundColor = "#0d1015"
secondaryBackgroundColor = "#141821"
textColor = "#e6e8eb"
borderColor = "#252b37"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "0.375rem"
showSidebarBorder = true

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
